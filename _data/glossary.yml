palindrome:
  title: "Palindrome"
  meanings:
    - context: "Linguistics"
      definition: "A word, number, phrase, or sequence that reads the same forward and backward (e.g., 16461, rotor, tenet). Derived from Greek 'palíndromos' meaning 'running back again'."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Ambigram_palindrome_%CE%9D%CE%99%CE%A8%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%9C%CE%97%CE%9C%CE%91%CE%A4%CE%91%CE%9C%CE%97%CE%9C%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%A8%CE%99%CE%9D_%28Wash_your_sins%2C_not_only_your_face%2C_in_Greek%29.jpg/960px-Ambigram_palindrome_%CE%9D%CE%99%CE%A8%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%9C%CE%97%CE%9C%CE%91%CE%A4%CE%91%CE%9C%CE%97%CE%9C%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%A8%CE%99%CE%9D_%28Wash_your_sins%2C_not_only_your_face%2C_in_Greek%29.jpg"

reflectional_symmetry:
  title: "Reflectional Symmetry"
  meanings:
    - context: "Geometry"
      definition: "A property where one half of an object is the mirror image of the other half across a central axis. Also called line symmetry or mirror symmetry."
      image: "https://upload.wikimedia.org/wikipedia/commons/2/2d/Symmetry.png"

decimal:
  title: "Decimal System"
  meanings:
    - context: "Mathematics"
      definition: "The base-10 numeral system that uses ten digits (0–9). It is the standard system for denoting integer and non-integer numbers."
      image: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Decimal_digit.png"

natural_numbers:
  title: "Natural Numbers"
  meanings:
    - context: "Mathematics"
      definition: "The set of positive integers used for counting and ordering: {1, 2, 3, ...}. Sometimes includes 0 depending on the definition."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Three_Baskets_with_Apples.svg/960px-Three_Baskets_with_Apples.svg.png"

numeral_system:
  title: "Numeral System"
  meanings:
    - context: "Mathematics"
      definition: "A writing system for expressing numbers using digits or other symbols in a consistent manner. Examples include decimal (base-10), binary (base-2), and hexadecimal (base-16)."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Numeral_Systems_of_the_World.svg/960px-Numeral_Systems_of_the_World.svg.png"

matrix_multiplication:
  title: "Matrix Multiplication"
  meanings:
    - context: "Linear Algebra"
      definition: "A binary operation that produces a matrix from two matrices. For A (m×k) and B (k×n), the product C = AB is an m×n matrix where each element cᵢⱼ = Σₖ aᵢₖ·bₖⱼ."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Matrix_multiplication_qtl1.svg/500px-Matrix_multiplication_qtl1.svg.png"

dot_product:
  title: "Dot Product"
  meanings:
    - context: "Linear Algebra"
      definition: "An algebraic operation that takes two equal-length sequences of numbers and returns a single number by multiplying corresponding entries and summing the products."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Inner-product-angle.svg/500px-Inner-product-angle.svg.png"

pointer:
  title: "Pointer"
  meanings:
    - context: "Computer Science"
      definition: "A programming language object that stores a memory address. In C, a pointer is a variable whose value is the address of another variable, enabling direct memory manipulation."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Pointers.svg/500px-Pointers.svg.png"

macro:
  title: "Macro"
  meanings:
    - context: "Computer Science"
      definition: "A fragment of code that has been given a name. In C, #define creates preprocessor macros that are textually replaced before compilation, unlike functions which are called at runtime."

algorithm:
  title: "Algorithm"
  meanings:
    - context: "Computer Science"
      definition: "A finite sequence of well-defined instructions to solve a specific problem or perform a computation. The word comes from the 9th-century mathematician Al-Khwarizmi."

rotor:
  title: "Rotor"
  meanings:
    - context: "Linguistics"
      definition: "A palindrome word that reads the same backward as forward: r-o-t-o-r."
    - context: "Engineering"
      definition: "A rotating part of an electrical machine or mechanical device, such as in a motor, generator, or helicopter."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Various_motor_rotor_TICI.jpg/960px-Various_motor_rotor_TICI.jpg"

sequence:
  title: "Sequence"
  meanings:
    - context: "Mathematics"
      definition: "In mathematics, an integer sequence is a sequence of integer."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Goteborg_ciag_Fibonacciego.jpg/500px-Goteborg_ciag_Fibonacciego.jpg"

recurrence:
  title: "Recurrence relation"
  meanings:
    - context: "Mathematics"
      definition: "A recurrence relation is an equation that expresses each element of a sequence as a function of its preceding elements. It defines the term based on previous terms"

factorial:
  title: "Factorial"
  meanings:
    - context: "Mathematics"
      definition: "The product of all positive integers up to a given number n, written as n!. For example, 5! = 5 × 4 × 3 × 2 × 1 = 120. By definition, 0! = 1."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Factorial_plot.svg/320px-Factorial_plot.svg.png"

recursion:
  title: "Recursion"
  meanings:
    - context: "Computer Science"
      definition: "A programming technique where a function calls itself to solve smaller instances of the same problem. Every recursive function needs a base case to stop the infinite loop."
    - context: "Mathematics"
      definition: "A method of defining sequences or functions where each term is defined in terms of previous terms. Factorial is defined recursively: n! = n × (n-1)!."

base_case:
  title: "Base Case"
  meanings:
    - context: "Computer Science"
      definition: "The condition in a recursive function that stops further recursive calls. Without a base case, recursion would continue infinitely and cause a stack overflow."

stack_overflow:
  title: "Stack Overflow"
  meanings:
    - context: "Computer Science"
      definition: "An error that occurs when a program uses more memory than the call stack can hold. Common cause: infinite recursion or deeply nested function calls."

search_algorithm:
  title: "Search Algorithm"
  meanings:
    - context: "Computer Science"
      definition: "An algorithm designed to find specific data within a data structure. Examples include linear search, binary search, and hash-based search."

binary_search:
  title: "Binary Search"
  meanings:
    - context: "Computer Science"
      definition: "An efficient search algorithm that finds a target value in a sorted array by repeatedly dividing the search interval in half. Time complexity: O(log n)."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Binary_Search_Depiction.svg/500px-Binary_Search_Depiction.svg.png"

sorted_array:
  title: "Sorted Array"
  meanings:
    - context: "Computer Science"
      definition: "An array where elements are arranged in a specific order (ascending or descending). Binary search requires a sorted array to work correctly."

time_complexity:
  title: "Time Complexity"
  meanings:
    - context: "Computer Science"
      definition: "A measure of the amount of time an algorithm takes to complete as a function of the input size. Common notations: O(1), O(log n), O(n), O(n²)."

logarithm:
  title: "Logarithm"
  meanings:
    - context: "Mathematics"
      definition: "The inverse operation to exponentiation. log₂(n) answers: 'How many times must we divide n by 2 to get 1?' Binary search runs in O(log n) time because it halves the problem each step."
    - context: "Computer Science"
      definition: "In algorithm analysis, log n describes algorithms that divide the problem in half each iteration. Extremely efficient for large datasets."

iteration:
  title: "Iteration"
  meanings:
    - context: "Computer Science"
      definition: "The repetition of a process or set of instructions in a program. Can be implemented using loops (for, while) or recursion."

for_loop:
  title: "For Loop"
  meanings:
    - context: "Computer Science"
      definition: "A control flow statement that allows code to be executed repeatedly based on a boolean condition. Typically used when the number of iterations is known beforehand."

sequential_search:
  title: "Sequential Search"
  meanings:
    - context: "Computer Science"
      definition: "Also called linear search. Checks each element in a list one by one until the target is found. Simple but slow: O(n) time complexity."

midpoint:
  title: "Midpoint"
  meanings:
    - context: "Mathematics"
      definition: "The middle point of a line segment or interval. In binary search, the midpoint divides the array into two halves to decide which half contains the target."

divide_and_conquer:
  title: "Divide and Conquer"
  meanings:
    - context: "Computer Science"
      definition: "An algorithm design paradigm that breaks a problem into smaller sub-problems, solves each sub-problem independently, and combines their solutions. Binary search is the simplest divide-and-conquer algorithm."

non_negative_integer:
  title: "Non-negative Integer"
  meanings:
    - context: "Mathematics"
      definition: "An integer that is greater than or equal to zero: {0, 1, 2, 3, ...}. Factorial is only defined for non-negative integers."

product:
  title: "Product"
  meanings:
    - context: "Mathematics"
      definition: "The result of multiplying two or more numbers together. The factorial of n is the product of all positive integers from 1 to n."

exponentiation:
  title: "Exponentiation"
  meanings:
    - context: "Mathematics"
      definition: "The operation of raising a number (the base) to the power of another number (the exponent). For example, 2³ = 2 × 2 × 2 = 8. The inverse is the logarithm."

call_stack:
  title: "Call Stack"
  meanings:
    - context: "Computer Science"
      definition: "A data structure that stores information about active function calls. When a function calls itself (recursion), a new frame is pushed onto the stack. When the function returns, the frame is popped off."