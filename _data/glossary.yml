palindrome:
  title: "Palindrome"
  meanings:
    - context: "Linguistics"
      definition: "A word, number, phrase, or sequence that reads the same forward and backward (e.g., 16461, rotor, tenet). Derived from Greek 'palíndromos' meaning 'running back again'."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Ambigram_palindrome_%CE%9D%CE%99%CE%A8%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%9C%CE%97%CE%9C%CE%91%CE%A4%CE%91%CE%9C%CE%97%CE%9C%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%A8%CE%99%CE%9D_%28Wash_your_sins%2C_not_only_your_face%2C_in_Greek%29.jpg/960px-Ambigram_palindrome_%CE%9D%CE%99%CE%A8%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%9C%CE%97%CE%9C%CE%91%CE%A4%CE%91%CE%9C%CE%97%CE%9C%CE%9F%CE%9D%CE%91%CE%9D%CE%9F%CE%A8%CE%99%CE%9D_%28Wash_your_sins%2C_not_only_your_face%2C_in_Greek%29.jpg"

reflectional_symmetry:
  title: "Reflectional Symmetry"
  meanings:
    - context: "Geometry"
      definition: "A property where one half of an object is the mirror image of the other half across a central axis. Also called line symmetry or mirror symmetry."
      image: "https://upload.wikimedia.org/wikipedia/commons/2/2d/Symmetry.png"

decimal:
  title: "Decimal System"
  meanings:
    - context: "Mathematics"
      definition: "The base-10 numeral system that uses ten digits (0–9). It is the standard system for denoting integer and non-integer numbers."
      image: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Decimal_digit.png"

natural_numbers:
  title: "Natural Numbers"
  meanings:
    - context: "Mathematics"
      definition: "The set of positive integers used for counting and ordering: {1, 2, 3, ...}. Sometimes includes 0 depending on the definition."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Three_Baskets_with_Apples.svg/960px-Three_Baskets_with_Apples.svg.png"

numeral_system:
  title: "Numeral System"
  meanings:
    - context: "Mathematics"
      definition: "A writing system for expressing numbers using digits or other symbols in a consistent manner. Examples include decimal (base-10), binary (base-2), and hexadecimal (base-16)."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Numeral_Systems_of_the_World.svg/960px-Numeral_Systems_of_the_World.svg.png"

matrix_multiplication:
  title: "Matrix Multiplication"
  meanings:
    - context: "Linear Algebra"
      definition: "A binary operation that produces a matrix from two matrices. For A (m×k) and B (k×n), the product C = AB is an m×n matrix where each element cᵢⱼ = Σₖ aᵢₖ·bₖⱼ."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Matrix_multiplication_qtl1.svg/500px-Matrix_multiplication_qtl1.svg.png"

dot_product:
  title: "Dot Product"
  meanings:
    - context: "Linear Algebra"
      definition: "An algebraic operation that takes two equal-length sequences of numbers and returns a single number by multiplying corresponding entries and summing the products."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Inner-product-angle.svg/500px-Inner-product-angle.svg.png"

pointer:
  title: "Pointer"
  meanings:
    - context: "Computer Science"
      definition: "A programming language object that stores a memory address. In C, a pointer is a variable whose value is the address of another variable, enabling direct memory manipulation."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Pointers.svg/500px-Pointers.svg.png"

macro:
  title: "Macro"
  meanings:
    - context: "Computer Science"
      definition: "A fragment of code that has been given a name. In C, #define creates preprocessor macros that are textually replaced before compilation, unlike functions which are called at runtime."

algorithm:
  title: "Algorithm"
  meanings:
    - context: "Computer Science"
      definition: "A finite sequence of well-defined instructions to solve a specific problem or perform a computation. The word comes from the 9th-century mathematician Al-Khwarizmi."

rotor:
  title: "Rotor"
  meanings:
    - context: "Linguistics"
      definition: "A palindrome word that reads the same backward as forward: r-o-t-o-r."
    - context: "Engineering"
      definition: "A rotating part of an electrical machine or mechanical device, such as in a motor, generator, or helicopter."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Various_motor_rotor_TICI.jpg/960px-Various_motor_rotor_TICI.jpg"

sequence:
  title: "Sequence"
  meanings:
    - context: "Mathematics"
      definition: "In mathematics, an integer sequence is a sequence of integer."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Goteborg_ciag_Fibonacciego.jpg/500px-Goteborg_ciag_Fibonacciego.jpg"

recurrence:
  title: "Recurrence relation"
  meanings:
    - context: "Mathematics"
      definition: "A recurrence relation is an equation that expresses each element of a sequence as a function of its preceding elements. It defines the term based on previous terms"

factorial:
  title: "Factorial"
  meanings:
    - context: "Mathematics"
      definition: "The product of all positive integers up to a given number n, written as n!. For example, 5! = 5 × 4 × 3 × 2 × 1 = 120. By definition, 0! = 1."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Factorial_plot.svg/320px-Factorial_plot.svg.png"

recursion:
  title: "Recursion"
  meanings:
    - context: "Computer Science"
      definition: "A programming technique where a function calls itself to solve smaller instances of the same problem. Every recursive function needs a base case to stop the infinite loop."
    - context: "Mathematics"
      definition: "A method of defining sequences or functions where each term is defined in terms of previous terms. Factorial is defined recursively: n! = n × (n-1)!."

base_case:
  title: "Base Case"
  meanings:
    - context: "Computer Science"
      definition: "The condition in a recursive function that stops further recursive calls. Without a base case, recursion would continue infinitely and cause a stack overflow."

stack_overflow:
  title: "Stack Overflow"
  meanings:
    - context: "Computer Science"
      definition: "An error that occurs when a program uses more memory than the call stack can hold. Common cause: infinite recursion or deeply nested function calls."

search_algorithm:
  title: "Search Algorithm"
  meanings:
    - context: "Computer Science"
      definition: "An algorithm designed to find specific data within a data structure. Examples include linear search, binary search, and hash-based search."

binary_search:
  title: "Binary Search"
  meanings:
    - context: "Computer Science"
      definition: "An efficient search algorithm that finds a target value in a sorted array by repeatedly dividing the search interval in half. Time complexity: O(log n)."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Binary_Search_Depiction.svg/500px-Binary_Search_Depiction.svg.png"

sorted_array:
  title: "Sorted Array"
  meanings:
    - context: "Computer Science"
      definition: "An array where elements are arranged in a specific order (ascending or descending). Binary search requires a sorted array to work correctly."

time_complexity:
  title: "Time Complexity"
  meanings:
    - context: "Computer Science"
      definition: "A measure of the amount of time an algorithm takes to complete as a function of the input size. Common notations: O(1), O(log n), O(n), O(n²)."

logarithm:
  title: "Logarithm"
  meanings:
    - context: "Mathematics"
      definition: "The inverse operation to exponentiation. log₂(n) answers: 'How many times must we divide n by 2 to get 1?' Binary search runs in O(log n) time because it halves the problem each step."
    - context: "Computer Science"
      definition: "In algorithm analysis, log n describes algorithms that divide the problem in half each iteration. Extremely efficient for large datasets."

iteration:
  title: "Iteration"
  meanings:
    - context: "Computer Science"
      definition: "The repetition of a process or set of instructions in a program. Can be implemented using loops (for, while) or recursion."

for_loop:
  title: "For Loop"
  meanings:
    - context: "Computer Science"
      definition: "A control flow statement that allows code to be executed repeatedly based on a boolean condition. Typically used when the number of iterations is known beforehand."

sequential_search:
  title: "Sequential Search"
  meanings:
    - context: "Computer Science"
      definition: "Also called linear search. Checks each element in a list one by one until the target is found. Simple but slow: O(n) time complexity."

midpoint:
  title: "Midpoint"
  meanings:
    - context: "Mathematics"
      definition: "The middle point of a line segment or interval. In binary search, the midpoint divides the array into two halves to decide which half contains the target."

divide_and_conquer:
  title: "Divide and Conquer"
  meanings:
    - context: "Computer Science"
      definition: "An algorithm design paradigm that breaks a problem into smaller sub-problems, solves each sub-problem independently, and combines their solutions. Binary search is the simplest divide-and-conquer algorithm."

non_negative_integer:
  title: "Non-negative Integer"
  meanings:
    - context: "Mathematics"
      definition: "An integer that is greater than or equal to zero: {0, 1, 2, 3, ...}. Factorial is only defined for non-negative integers."

product:
  title: "Product"
  meanings:
    - context: "Mathematics"
      definition: "The result of multiplying two or more numbers together. The factorial of n is the product of all positive integers from 1 to n."

exponentiation:
  title: "Exponentiation"
  meanings:
    - context: "Mathematics"
      definition: "The operation of raising a number (the base) to the power of another number (the exponent). For example, 2³ = 2 × 2 × 2 = 8. The inverse is the logarithm."

call_stack:
  title: "Call Stack"
  meanings:
    - context: "Computer Science"
      definition: "A data structure that stores information about active function calls. When a function calls itself (recursion), a new frame is pushed onto the stack. When the function returns, the frame is popped off."

linear_algebra:
  title: "Linear Algebra"
  meanings:
    - context: "Mathematics"
      definition: "The branch of mathematics concerning linear equations, linear functions, and their representations through matrices and vector spaces. It is the foundational language of modern AI, computer graphics, and data science."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Linear_subspaces_with_shading.svg/500px-Linear_subspaces_with_shading.svg.png"

target_value:
  title: "Target Value"
  meanings:
    - context: "Computer Science"
      definition: "The specific element or value that a search algorithm is attempting to find within a data structure. In binary search, the target value is compared against the midpoint to decide which half of the array to search next."

index:
  title: "Index"
  meanings:
    - context: "Computer Science"
      definition: "An integer that identifies the position of an element within an array or list. Array indices in C start at 0, meaning the first element is at index 0, the second at index 1, and so on."
    - context: "Mathematics"
      definition: "A subscript notation (e.g., aᵢ) used to identify a specific element in a sequence, series, or matrix."

identity_matrix:
  title: "Identity Matrix"
  meanings:
    - context: "Linear Algebra"
      definition: "A square matrix with ones on the main diagonal and zeros elsewhere. It acts as the multiplicative identity in matrix algebra: for any matrix A, A × I = I × A = A."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Matrix.svg/500px-Matrix.svg.png"

vector:
  title: "Vector"
  meanings:
    - context: "Linear Algebra"
      definition: "An ordered list of numbers that can represent magnitude and direction. In computing, it is a one-dimensional array. The dot product of two vectors yields a scalar."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Vector_projection.svg/500px-Vector_projection.svg.png"

dimension:
  title: "Dimension"
  meanings:
    - context: "Linear Algebra"
      definition: "The number of rows and columns in a matrix, expressed as m × n (m rows by n columns). The inner dimensions must match for matrix multiplication."
    - context: "Computer Science"
      definition: "The size of an array along a particular axis. A 2D array has two dimensions: rows and columns."

array:
  title: "Array"
  meanings:
    - context: "Computer Science"
      definition: "A data structure consisting of a collection of elements, each identified by at least one array index or key. In C, arrays are contiguous blocks of memory storing elements of the same type."

element:
  title: "Element"
  meanings:
    - context: "Computer Science"
      definition: "A single item stored in an array, list, matrix, or other data structure. Each element is accessed via an index."
    - context: "Mathematics"
      definition: "An individual entry within a matrix or sequence, often denoted with subscript notation such as aᵢⱼ."

heap:
  title: "Heap Memory"
  meanings:
    - context: "Computer Science"
      definition: "A region of a computer's memory space used for dynamic allocation. Unlike the stack, the programmer must manually manage heap memory (e.g., using malloc() and free() in C)."

memory_leak:
  title: "Memory Leak"
  meanings:
    - context: "Computer Science"
      definition: "A type of resource leak that occurs when a computer program incorrectly manages memory allocations, failing to release memory that is no longer needed. In C, forgetting to free() allocated memory causes leaks."

cache:
  title: "Cache"
  meanings:
    - context: "Computer Science"
      definition: "A hardware or software component that stores data so that future requests for that data can be served faster. In matrix multiplication, transposing the second matrix can improve cache locality and speed."

transpose:
  title: "Transpose"
  meanings:
    - context: "Linear Algebra"
      definition: "An operation that flips a matrix over its diagonal, switching the row and column indices of each element. The transpose of A is denoted Aᵀ."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Matrix_transpose.gif/500px-Matrix_transpose.gif"

permutation:
  title: "Permutation"
  meanings:
    - context: "Mathematics"
      definition: "An arrangement of all the members of a set into some sequence or order. The number of permutations of n distinct items is n!."

combination:
  title: "Combination"
  meanings:
    - context: "Mathematics"
      definition: "A selection of items from a collection where the order of selection does not matter. Related to factorial through the binomial coefficient formula."

taylor_series:
  title: "Taylor Series"
  meanings:
    - context: "Mathematics"
      definition: "An infinite sum of terms expressed in terms of the derivatives of a function at a single point. Used to approximate functions like eˣ, sin(x), and cos(x) using factorials in the denominators."

large_language_model:
  title: "Large Language Model (LLM)"
  meanings:
    - context: "Artificial Intelligence"
      definition: "A type of neural network trained on vast amounts of text data to understand, generate, and reason with human language. Examples include GPT-4, Claude, and DeepSeek-V3. LLMs are the foundation of modern chatbots and AI assistants."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Transformer_architecture.png/640px-Transformer_architecture.png"

parameters:
  title: "Parameters"
  meanings:
    - context: "Machine Learning"
      definition: "The internal variables (weights and biases) of a neural network that are learned during training. More parameters generally mean greater capacity to learn complex patterns, but also require more computation. A 7B parameter model has 7 billion of these variables."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Neural_network_example.svg/500px-Neural_network_example.svg.png"

token:
  title: "Token"
  meanings:
    - context: "Natural Language Processing"
      definition: "A unit of text that a language model processes. Can be a word, part of a word, or punctuation. For example, 'unbelievable' might be split into 'un', 'believ', and 'able'. Pricing for AI APIs is typically measured in tokens processed."

context_window:
  title: "Context Window"
  meanings:
    - context: "Natural Language Processing"
      definition: "The maximum number of tokens a language model can process in a single conversation or document. A 128K context window means the model can 'remember' roughly 96,000 words at once. DeepSeek-V4 supports 1 million tokens."

training:
  title: "Training (Machine Learning)"
  meanings:
    - context: "Machine Learning"
      definition: "The process of teaching a neural network by feeding it large datasets and adjusting its parameters to minimize prediction errors. Training frontier AI models requires millions of GPU hours and costs millions of dollars."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Gradient_descent.gif/440px-Gradient_descent.gif"

inference:
  title: "Inference"
  meanings:
    - context: "Machine Learning"
      definition: "The process of using a trained model to make predictions or generate outputs. Unlike training, inference does not modify the model's parameters. It is what happens when you send a prompt to ChatGPT or DeepSeek and receive a response."

neural_network:
  title: "Neural Network"
  meanings:
    - context: "Artificial Intelligence"
      definition: "A computing system inspired by biological brains, composed of interconnected nodes (neurons) organized in layers. Deep learning uses multi-layer neural networks (hence 'deep') to learn hierarchical representations of data."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Colored_neural_network.svg/500px-Colored_neural_network.svg.png"

attention_mechanism:
  title: "Attention Mechanism"
  meanings:
    - context: "Deep Learning"
      definition: "A technique in neural networks that allows the model to focus on different parts of the input when producing each part of the output. In transformers, self-attention lets every token 'look at' every other token, enabling the model to understand relationships across long distances in text."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Transformer_architecture.png/640px-Transformer_architecture.png"

kv_cache:
  title: "KV Cache"
  meanings:
    - context: "Transformer Architecture"
      definition: "Key-Value Cache. During inference in transformer models, the Key and Value matrices for previously processed tokens are stored and reused rather than recomputed. This speeds up generation but consumes significant memory. DeepSeek's MLA innovation compresses this cache dramatically."

mixture_of_experts:
  title: "Mixture of Experts (MoE)"
  meanings:
    - context: "Deep Learning"
      definition: "A neural network architecture where only a subset of the model's parameters (called 'experts') are activated for each input token. A 'router' network decides which experts to use. This allows models to have massive total parameters while keeping inference costs manageable. DeepSeek innovated by adding 'shared experts' that are always active."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Transformer_architecture.png/640px-Transformer_architecture.png"

reinforcement_learning:
  title: "Reinforcement Learning (RL)"
  meanings:
    - context: "Machine Learning"
      definition: "A training paradigm where an agent learns to make decisions by receiving rewards or penalties from its environment. In AI, RLHF (Reinforcement Learning from Human Feedback) trains models to align with human preferences. DeepSeek's GRPO is a variant that eliminates the need for a separate critic model."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Reinforcement_learning_diagram.svg/500px-Reinforcement_learning_diagram.svg.png"

reasoning_model:
  title: "Reasoning Model"
  meanings:
    - context: "Artificial Intelligence"
      definition: "A language model trained to generate step-by-step chains of thought before producing a final answer. Unlike standard models that answer directly, reasoning models 'show their work' — making them more accurate for math, coding, and logic but slower for simple queries. DeepSeek-R1 is a leading example."

distillation:
  title: "Model Distillation"
  meanings:
    - context: "Machine Learning"
      definition: "A technique where a smaller 'student' model is trained to mimic the behavior of a larger 'teacher' model. DeepSeek distilled R1's reasoning capabilities into models as small as 1.5B parameters, making advanced reasoning accessible on consumer hardware."

benchmark:
  title: "Benchmark"
  meanings:
    - context: "Machine Learning"
      definition: "A standardized test used to evaluate and compare AI models. Common benchmarks include MMLU (general knowledge), HumanEval (coding), GSM8K (math), and SWE-bench (software engineering). Scores should be interpreted with caution — benchmarks do not capture all real-world capabilities."

api:
  title: "API (Application Programming Interface)"
  meanings:
    - context: "Software Engineering"
      definition: "A set of protocols that allows different software applications to communicate. In AI, an API lets developers send text to a model and receive generated responses programmatically. DeepSeek's API is significantly cheaper than competitors — $0.14 per million input tokens for V4 Flash."

open_source:
  title: "Open Source"
  meanings:
    - context: "Software"
      definition: "Software whose source code is made available under a license that permits anyone to use, study, change, and distribute it. DeepSeek releases models under the MIT License, one of the most permissive open-source licenses. Note: 'Open weights' (sharing trained model files) is not the same as full open source (sharing training code and data)."

speculative_decoding:
  title: "Speculative Decoding"
  meanings:
    - context: "Machine Learning"
      definition: "An inference optimization technique where a smaller, faster 'draft' model generates candidate tokens, and a larger model verifies them in parallel. Correct tokens are accepted; incorrect ones are rejected and regenerated. DeepSeek's DSpark achieves 60–85% speedup with byte-identical outputs."

hedge_fund:
  title: "Hedge Fund"
  meanings:
    - context: "Finance"
      definition: "An investment partnership that pools capital from accredited investors and employs diverse strategies to generate returns. High-Flyer, DeepSeek's parent company, is a quantitative hedge fund that uses AI and mathematical models for algorithmic trading."

gpu:
  title: "GPU (Graphics Processing Unit)"
  meanings:
    - context: "Computer Hardware"
      definition: "A specialized processor designed for parallel computation, originally for graphics rendering. Modern AI training and inference rely heavily on GPUs (especially Nvidia's H100/H800/A100) because neural network operations can be massively parallelized. DeepSeek trains on H800 GPUs, a restricted-export variant of the H100."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/NVIDIA_Tesla_V100.jpg/640px-NVIDIA_Tesla_V100.jpg"

artificial_intelligence:
  title: "Artificial Intelligence (AI)"
  meanings:
    - context: "Computer Science"
      definition: "The simulation of human intelligence processes by machines, especially computer systems. These processes include learning (acquiring information and rules for using it), reasoning (using rules to reach conclusions), and self-correction. DeepSeek is an AI company that develops large language models."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Colored_neural_network.svg/500px-Colored_neural_network.svg.png"

liang_wenfeng:
  title: "Liang Wenfeng"
  meanings:
    - context: "Business"
      definition: "Chinese entrepreneur and AI researcher, founder and CEO of DeepSeek. Previously co-founded High-Flyer, a quantitative hedge fund, in 2015. He holds an 84% stake in DeepSeek through shell corporations as of May 2024."

high_flyer:
  title: "High-Flyer"
  meanings:
    - context: "Finance"
      definition: "A Chinese quantitative hedge fund co-founded by Liang Wenfeng in June 2015. High-Flyer began using GPU-dependent deep learning for stock trading in 2016 and became the principal investor and parent company of DeepSeek when it was spun off in July 2023."

quantitative:
  title: "Quantitative (Finance)"
  meanings:
    - context: "Finance"
      definition: "An investment strategy that uses mathematical models, statistical analysis, and algorithms to make trading decisions. High-Flyer is a quantitative hedge fund that uses AI and deep learning to drive its trading strategies."

hangzhou:
  title: "Hangzhou"
  meanings:
    - context: "Geography"
      definition: "The capital city of Zhejiang Province in eastern China. Known as a major technology hub, it is home to Alibaba and DeepSeek. DeepSeek's headquarters is located in Hangzhou."

zhejiang:
  title: "Zhejiang"
  meanings:
    - context: "Geography"
      definition: "A province in eastern China known for its technology industry and entrepreneurial culture. Hangzhou, its capital, hosts major tech companies including DeepSeek and Alibaba."

china:
  title: "China"
  meanings:
    - context: "Geography"
      definition: "The world's most populous country and second-largest economy. China has become a major player in artificial intelligence research, with companies like DeepSeek, Baidu, and Alibaba developing competitive large language models despite US chip export restrictions."

venture_capital:
  title: "Venture Capital"
  meanings:
    - context: "Finance"
      definition: "A form of private equity financing provided by investors to startups and small businesses with long-term growth potential. DeepSeek notably did not rely on venture capital; its parent company High-Flyer provided funding after VC investors were reluctant to invest."

open_weight:
  title: "Open Weights"
  meanings:
    - context: "Machine Learning"
      definition: "A model release strategy where the trained parameters (weights) of a neural network are made publicly available for download, but the training data and code may remain private. DeepSeek releases open-weight models, allowing anyone to run them locally. This is less open than full open source."

mit_license:
  title: "MIT License"
  meanings:
    - context: "Software"
      definition: "A permissive free software license originating at the Massachusetts Institute of Technology. It allows reuse, modification, and distribution for any purpose, including commercial use, with minimal restrictions. DeepSeek has released models under the MIT License since 2025."

gpu:
  title: "GPU (Graphics Processing Unit)"
  meanings:
    - context: "Computer Hardware"
      definition: "A specialized processor designed for parallel computation, originally for graphics rendering. Modern AI training and inference rely heavily on GPUs because neural network operations can be massively parallelized. DeepSeek trains on Nvidia H800 GPUs, a restricted-export variant of the H100."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/NVIDIA_Tesla_V100.jpg/640px-NVIDIA_Tesla_V100.jpg"

h800:
  title: "Nvidia H800"
  meanings:
    - context: "Computer Hardware"
      definition: "A restricted-export variant of Nvidia's H100 GPU, designed for the Chinese market with reduced interconnect bandwidth to comply with US export controls. DeepSeek trains its models on H800 GPUs, achieving competitive results despite using weaker hardware than US labs."

openai:
  title: "OpenAI"
  meanings:
    - context: "Artificial Intelligence"
      definition: "An American AI research laboratory founded in 2015, known for creating GPT (Generative Pre-trained Transformer) models and ChatGPT. OpenAI's GPT-4 reportedly cost approximately $100 million to train, compared to DeepSeek-V3's ~$5.6 million."

gpt4:
  title: "GPT-4"
  meanings:
    - context: "Artificial Intelligence"
      definition: "A large language model developed by OpenAI, released in March 2023. It is a multimodal model capable of accepting text and image inputs. OpenAI reportedly spent approximately $100 million training GPT-4, making DeepSeek-V3's $5.6M training cost a significant contrast."

deep_learning:
  title: "Deep Learning"
  meanings:
    - context: "Machine Learning"
      definition: "A subset of machine learning based on artificial neural networks with multiple layers (hence 'deep'). Deep learning powers modern AI systems including large language models, image recognition, and speech synthesis. High-Flyer began using deep learning for trading in 2016."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Colored_neural_network.svg/500px-Colored_neural_network.svg.png"

stock_trading:
  title: "Stock Trading"
  meanings:
    - context: "Finance"
      definition: "The buying and selling of shares in publicly traded companies. High-Flyer, DeepSeek's parent company, uses AI-driven quantitative models to automate stock trading decisions, having transitioned from CPU-based linear models to GPU-dependent deep learning in 2016."

ai_driven:
  title: "AI-Driven"
  meanings:
    - context: "Technology"
      definition: "A system or process that uses artificial intelligence to make decisions or perform tasks with minimal human intervention. By the end of 2017, most of High-Flyer's trading was AI-driven, meaning algorithms rather than humans were making the trading decisions."

computing_cluster:
  title: "Computing Cluster"
  meanings:
    - context: "Computer Science"
      definition: "A group of interconnected computers that work together as a single system. DeepSeek's parent company High-Flyer built Fire-Flyer 1 (1,100 GPUs) in 2019 and Fire-Flyer 2 (5,000 GPUs) in 2021. These clusters form the training infrastructure for DeepSeek's AI models."

nvidia_a100:
  title: "Nvidia A100"
  meanings:
    - context: "Computer Hardware"
      definition: "A high-performance data center GPU released by Nvidia in 2020, designed for AI training and scientific computing. Liang Wenfeng reportedly acquired 10,000 A100 GPUs before US export restrictions limited their sale to China. Fire-Flyer 2 used 5,000 A100 GPUs."
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/NVIDIA_Tesla_V100.jpg/640px-NVIDIA_Tesla_V100.jpg"

chip:
  title: "Semiconductor Chip"
  meanings:
    - context: "Computer Hardware"
      definition: "An integrated circuit that performs computations. AI training relies on specialized chips (GPUs) from companies like Nvidia. The United States has imposed export restrictions on advanced AI chips to China, forcing companies like DeepSeek to innovate with less powerful hardware."

united_states:
  title: "United States"
  meanings:
    - context: "Geography"
      definition: "A country in North America that has imposed export restrictions on advanced AI chips to China since 2022. These restrictions limited DeepSeek to weaker hardware (H800 instead of H100), which paradoxically drove the company to develop more efficient algorithms and software."

artificial_general_intelligence:
  title: "Artificial General Intelligence (AGI)"
  meanings:
    - context: "Artificial Intelligence"
      definition: "A hypothetical form of AI that possesses the ability to understand, learn, and apply knowledge across any intellectual task that a human can perform. It remains a theoretical goal. On April 14, 2023, High-Flyer announced an AGI research lab that would become DeepSeek."

model:
  title: "Model (Machine Learning)"
  meanings:
    - context: "Machine Learning"
      definition: "A trained neural network that has learned patterns from data and can make predictions or generate outputs. DeepSeek has released many models including Coder, LLM, V2, V3, R1, and V4. Each model is a file containing billions of learned parameters."

llama:
  title: "Llama"
  meanings:
    - context: "Artificial Intelligence"
      definition: "A family of large language models developed by Meta (formerly Facebook). Llama models are open-weight and have become a foundation for many subsequent models. DeepSeek's first models (Coder and LLM) were based on the Llama architecture before developing their own innovations."

open_source_model:
  title: "Open-Source Model"
  meanings:
    - context: "Machine Learning"
      definition: "A machine learning model whose architecture, weights, and often training code are publicly available under an open-source license. Llama is an open-weight model (not fully open source). DeepSeek's R1 and later models are released under the MIT License, a true open-source license."

llama_2_70b:
  title: "Llama 2 70B"
  meanings:
    - context: "Artificial Intelligence"
      definition: "A 70-billion-parameter large language model released by Meta in July 2023. DeepSeek-LLM 67B reportedly outperformed Llama 2 70B on reasoning, coding, math, and Chinese comprehension benchmarks when it was released in November 2023."

reasoning:
  title: "Reasoning (AI)"
  meanings:
    - context: "Artificial Intelligence"
      definition: "The ability of an AI model to perform step-by-step logical thinking to solve problems. Reasoning models like DeepSeek-R1 generate chains of thought before answering, making them more accurate for math, coding, and logic but slower for simple queries."

coding:
  title: "Coding (Programming)"
  meanings:
    - context: "Computer Science"
      definition: "The process of writing instructions (code) for computers using programming languages. DeepSeek Coder was specifically trained on 87% source code. Coding benchmarks like HumanEval and SWE-bench measure an AI's ability to write and debug programs."

math:
  title: "Mathematics"
  meanings:
    - context: "Mathematics"
      definition: "The abstract science of number, quantity, and space. AI models are evaluated on math benchmarks like GSM8K (grade school math) and MATH (competition-level problems). DeepSeek-Math and DeepSeek-R1 are particularly strong at mathematical reasoning."

deepseek_license:
  title: "DeepSeek License"
  meanings:
    - context: "Software"
      definition: "A source-available license used by DeepSeek for its early models (Coder, LLM, MoE, Math, V2). It permits open and responsible downstream usage but is more restrictive than the MIT License. Since 2025, DeepSeek has switched to the MIT License for newer models."

knobs:
  title: "Knobs (Metaphor)"
  meanings:
    - context: "Machine Learning"
      definition: "A metaphorical term for the adjustable parameters in a neural network. Just as turning a knob on a machine changes its behavior, adjusting a parameter changes how the model processes information. A 33B model has 33 billion such 'knobs.'"

dials:
  title: "Dials (Metaphor)"
  meanings:
    - context: "Machine Learning"
      definition: "A metaphorical term for the adjustable parameters in a neural network, used alongside 'knobs' to describe the billions of internal values that the model learns during training. Together they represent the model's learned knowledge."

expert_network:
  title: "Expert Network"
  meanings:
    - context: "Deep Learning"
      definition: "In a Mixture of Experts (MoE) model, an expert network is a specialized sub-network that handles specific types of inputs. DeepSeek's MoE architecture divides the model into many expert networks, with a router deciding which experts to activate for each token."

router:
  title: "Router (MoE)"
  meanings:
    - context: "Deep Learning"
      definition: "A small neural network within a Mixture of Experts (MoE) architecture that decides which expert sub-networks to activate for each input token. The router computes a score for all experts and selects the top-K highest-scoring ones. DeepSeek's router also handles shared experts that are always active."

shared_expert:
  title: "Shared Expert"
  meanings:
    - context: "Deep Learning"
      definition: "An expert sub-network in a Mixture of Experts model that is always activated for every input token, regardless of the router's decision. DeepSeek invented shared experts to handle common tasks (like basic grammar) while routed experts handle specialized tasks. This prevents expert collapse and improves efficiency."

routed_expert:
  title: "Routed Expert"
  meanings:
    - context: "Deep Learning"
      definition: "An expert sub-network in a Mixture of Experts model that is dynamically selected by the router for each input token. Only a small subset of routed experts are activated per token, making the model computationally efficient despite having billions of total parameters."

8_bit:
  title: "8-Bit Floating Point"
  meanings:
    - context: "Computer Science"
      definition: "A number format that uses 8 bits (1 byte) to represent a floating-point number. DeepSeek uses a custom 5E2M format (5-bit exponent, 2-bit mantissa) for training, which reduces memory usage and speeds up computation compared to standard 16-bit or 32-bit formats. This required writing custom GPU kernels."

cpu:
  title: "CPU (Central Processing Unit)"
  meanings:
    - context: "Computer Hardware"
      definition: "The primary processor in a computer that executes instructions from software. DeepSeek's hfreduce library runs communication tasks on the CPU asynchronously, allowing GPUs to continue computation without being blocked by network operations."

huawei:
  title: "Huawei"
  meanings:
    - context: "Technology"
      definition: "A Chinese multinational technology company that designs and manufactures telecommunications equipment, consumer electronics, and AI chips. DeepSeek-V4 has been adopted by Huawei and Cambricon for their Ascend and MLU chip platforms, enabling inference on non-Nvidia hardware."

cambricon:
  title: "Cambricon"
  meanings:
    - context: "Technology"
      definition: "A Chinese semiconductor company that designs AI chips (MLU series) for data centers and edge devices. DeepSeek-V4 has been adopted by Cambricon, demonstrating that the model can run efficiently on Chinese-made AI hardware as an alternative to Nvidia GPUs."
