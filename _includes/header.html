<header class="site-header">
  <div class="wrap">

    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>

    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <span class="theme-icon">🌙</span>
      </button>

      <button class="icon-btn menu-icon" id="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="site-nav" id="site-nav">
      <div class="trigger" id="nav-menu">
        {% for page in site.pages %}
          {% if page.title and page.includelink %}
            <a class="page-link" href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </nav>

  </div>
</header>
